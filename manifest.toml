packaging_format = 2

id = "streama"
name = "Streama"
description.en = "streaming media server"
description.fr = "Serveur de streaming"

version = "1.11.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://streamaserver.org/"
demo = "https://streama.demo-version.net"
admindoc = "https://docs.streama-project.com/"
code = "https://github.com/streamaserver/streama"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "If 'visitors', Streama will be accessible by people who do not have an account. This can be changed later via the webadmin."
    help.fr = "Si 'Visiteurs', Streama sera accessible aux personnes n’ayant pas de compte. Vous pourrez changer ceci plus tard via la webadmin."
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/streamaserver/streama/releases/download/v1.11.0/streama-1.11.0.jar"
        sha256 = "d52eeeea6bae959c7741a888ed9780f9b01d52f40ab96bd335b183326234165d"
        extract = false
        rename = "streama.jar"
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "^streama-.*.jar$"

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["data", "upload"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "ffmpeg, mariadb-server"

    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "openjdk-17-jre";
    elif [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "openjdk-21-jre";
    fi
    """

    [resources.database]
    type = "mysql"
